{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: {{ include "ktb-board-express.httpRouteName" . | quote }}

  labels:
    {{- include "ktb-board-express.labels" . | nindent 4 }}

spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.httpRoute.gateway.name | quote }}
      namespace: {{ .Values.httpRoute.gateway.namespace | quote }}
      sectionName: {{ .Values.httpRoute.gateway.listener | quote }}

  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}

  rules:
    - matches:
        - path:
            type: {{ .Values.httpRoute.path.type }}
            value: {{ .Values.httpRoute.path.value | quote }}

      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "ktb-board-express.serviceName" . | quote }}
          port: {{ .Values.service.port }}
          weight: 1
{{- end }}
