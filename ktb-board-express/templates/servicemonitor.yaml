{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ktb-board-express.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ktb-board-express.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      monitoring.ktb-board/component: {{ .Values.serviceMonitor.componentLabel | quote }}
  endpoints:
    - port: {{ .Values.serviceMonitor.port | quote }}
      path: {{ .Values.serviceMonitor.path | quote }}
      scheme: http
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
