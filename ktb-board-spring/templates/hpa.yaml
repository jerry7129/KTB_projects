{{- if .Values.autoscaling.enabled }}

{{- if and
      (not .Values.autoscaling.metrics.cpu.enabled)
      (not .Values.autoscaling.metrics.memory.enabled)
}}
{{- fail "HPA를 활성화하려면 CPU 또는 Memory metric 중 하나 이상을 활성화해야 합니다." }}
{{- end }}

{{- $hpaName := default
      (printf "%s-hpa" (include "ktb-board-spring.fullname" .))
      .Values.autoscaling.name
-}}

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: {{ $hpaName | quote }}
  labels:
    {{- include "ktb-board-spring.labels" . | nindent 4 }}
    environment: {{ .Values.environment | quote }}

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ktb-board-spring.deploymentName" . | quote }}

  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}

  metrics:
    {{- if .Values.autoscaling.metrics.cpu.enabled }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.metrics.cpu.averageUtilization }}
    {{- end }}

    {{- if .Values.autoscaling.metrics.memory.enabled }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.metrics.memory.averageUtilization }}
    {{- end }}

  behavior:
    {{- toYaml .Values.autoscaling.behavior | nindent 4 }}

{{- end }}
