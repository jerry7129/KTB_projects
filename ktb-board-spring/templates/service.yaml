apiVersion: v1
kind: Service

metadata:
  name: {{ include "ktb-board-spring.fullname" . }}-service
  labels:
    {{- include "ktb-board-spring.labels" . | nindent 4 }}

  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "ktb-board-spring.selectorLabels" . | nindent 4 }}

  ports:
    - name: {{ .Values.container.portName }}
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}

      # NodePort 번호는 Kubernetes가 자동으로 할당
      {{- with .Values.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
