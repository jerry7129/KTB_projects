name: Release Production

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      version:
        description: "배포할 Git tag (예: v1.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ktb-board-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: "180294193538"

  BACKEND_ECR_REPOSITORY: ktb-board-spring
  FRONTEND_ECR_REPOSITORY: ktb-board-express

  MANIFEST_BUCKET: ${{ vars.RELEASE_MANIFEST_BUCKET }}
  MANIFEST_PREFIX: ktb-board/manifests

jobs:
  release:
    name: Release to Production

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    environment: production

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      # Git tag와 해당 tag가 가리키는 commit을 확인한다.
      - name: Prepare release metadata
        id: vars
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::잘못된 버전입니다: ${VERSION}"
            echo "::error::예시: v1.0.0"
            exit 1
          fi

          git fetch \
            origin \
            "refs/tags/${VERSION}:refs/tags/${VERSION}" \
            --force \
            --depth=1

          if ! git show-ref \
            --verify \
            --quiet \
            "refs/tags/${VERSION}"; then

            echo "::error::Git tag가 존재하지 않습니다: ${VERSION}"
            exit 1
          fi

          COMMIT_SHA="$(
            git rev-list \
              -n 1 \
              "refs/tags/${VERSION}"
          )"

          # COMMIT_SHA가 main과 같거나 main의 과거 commit인지 확인한다.
          COMPARE_STATUS="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/compare/${COMMIT_SHA}...main" \
              --jq '.status'
          )"

          if [[ "${COMPARE_STATUS}" != "ahead" &&
                "${COMPARE_STATUS}" != "identical" ]]; then

            echo "::error::Release tag는 main에 포함된 commit이어야 합니다."
            echo "::error::Tag: ${VERSION}"
            echo "::error::Commit: ${COMMIT_SHA}"
            exit 1
          fi

          CANDIDATE_URI="s3://${MANIFEST_BUCKET}/${MANIFEST_PREFIX}/candidates/${COMMIT_SHA}.json"
          RELEASE_URI="s3://${MANIFEST_BUCKET}/${MANIFEST_PREFIX}/releases/${VERSION}.json"

          {
            echo "version=${VERSION}"
            echo "commit_sha=${COMMIT_SHA}"
            echo "candidate_uri=${CANDIDATE_URI}"
            echo "release_uri=${RELEASE_URI}"
          } >> "${GITHUB_OUTPUT}"

          echo "Release version: ${VERSION}"
          echo "Release commit: ${COMMIT_SHA}"
          echo "Candidate URI: ${CANDIDATE_URI}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: github-production-${{ github.run_id }}

      # Private ECR의 manifest를 inspect하기 위해 Docker 로그인이 필요하다.
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Candidate manifest의 commit, repository, image, digest 관계를 검증한다.
      - name: Download and validate candidate
        env:
          COMMIT_SHA: ${{ steps.vars.outputs.commit_sha }}
          CANDIDATE_URI: ${{ steps.vars.outputs.candidate_uri }}
        shell: bash
        run: |
          set -Eeuo pipefail

          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          if ! aws s3 cp \
            "${CANDIDATE_URI}" \
            /tmp/candidate.json \
            --only-show-errors; then

            echo "::error::Candidate manifest가 없습니다."
            echo "::error::Build Main Candidate Workflow를 먼저 확인하세요."
            exit 1
          fi

          jq -e \
            --arg commit "${COMMIT_SHA}" \
            --arg registry "${REGISTRY}" \
            --arg backendRepository "${BACKEND_ECR_REPOSITORY}" \
            --arg frontendRepository "${FRONTEND_ECR_REPOSITORY}" \
            '
              .schemaVersion == 1 and
              .kind == "KtbBoardReleaseCandidate" and
              .candidateCommit == $commit and

              .components.spring.repository ==
                $backendRepository and

              (
                .components.spring.digest |
                type == "string" and
                test("^sha256:[0-9a-f]{64}$")
              ) and

              (
                .components.spring.image ==
                (
                  $registry +
                  "/" +
                  $backendRepository +
                  "@" +
                  .components.spring.digest
                )
              ) and

              .components.express.repository ==
                $frontendRepository and

              (
                .components.express.digest |
                type == "string" and
                test("^sha256:[0-9a-f]{64}$")
              ) and

              (
                .components.express.image ==
                (
                  $registry +
                  "/" +
                  $frontendRepository +
                  "@" +
                  .components.express.digest
                )
              )
            ' \
            /tmp/candidate.json \
            >/dev/null

          jq . /tmp/candidate.json

      # 각 Candidate digest가 실제 multi-architecture manifest인지 검사한다.
      - name: Verify multi-architecture images
        shell: bash
        run: |
          set -Eeuo pipefail

          SPRING_IMAGE="$(
            jq -r \
              '.components.spring.image' \
              /tmp/candidate.json
          )"

          EXPRESS_IMAGE="$(
            jq -r \
              '.components.express.image' \
              /tmp/candidate.json
          )"

          verify_multiarch() {
            local component="$1"
            local image="$2"
            local manifest_file="/tmp/${component}-manifest.json"

            echo "Inspecting ${component}: ${image}"

            docker buildx imagetools inspect \
              --raw \
              "${image}" \
              > "${manifest_file}"

            if ! jq -e \
              '
                .schemaVersion == 2 and

                (
                  .mediaType ==
                    "application/vnd.docker.distribution.manifest.list.v2+json"
                  or
                  .mediaType ==
                    "application/vnd.oci.image.index.v1+json"
                ) and

                any(
                  .manifests[]?;
                  .platform.os == "linux" and
                  .platform.architecture == "amd64"
                ) and

                any(
                  .manifests[]?;
                  .platform.os == "linux" and
                  .platform.architecture == "arm64"
                )
              ' \
              "${manifest_file}" \
              >/dev/null; then

              echo "::error::${component} image는 amd64와 arm64를 모두 포함해야 합니다."
              jq . "${manifest_file}" || true
              exit 1
            fi

            echo "${component} supported platforms:"

            jq -r \
              '.manifests[] |
               select(.platform.os != null) |
               "  - \(.platform.os)/\(.platform.architecture)"' \
              "${manifest_file}"
          }

          verify_multiarch \
            "spring" \
            "${SPRING_IMAGE}"

          verify_multiarch \
            "express" \
            "${EXPRESS_IMAGE}"

      # Candidate를 다시 빌드하지 않고 Release tag를 추가
      - name: Add release tags to multi-architecture images
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail

          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          SPRING_IMAGE="$(
            jq -r '.components.spring.image' /tmp/candidate.json
          )"

          EXPRESS_IMAGE="$(
            jq -r '.components.express.image' /tmp/candidate.json
          )"

          SPRING_DIGEST="$(
            jq -r '.components.spring.digest' /tmp/candidate.json
          )"

          EXPRESS_DIGEST="$(
            jq -r '.components.express.digest' /tmp/candidate.json
          )"

          promote() {
            local repository="$1"
            local source_image="$2"
            local expected_digest="$3"

            local target_image="${REGISTRY}/${repository}:${VERSION}"

            echo "Promoting ${source_image}"
            echo "Target: ${target_image}"

            docker buildx imagetools create \
              --tag "${target_image}" \
              "${source_image}"

            actual_digest="$(
              aws ecr describe-images \
                --region "${AWS_REGION}" \
                --repository-name "${repository}" \
                --image-ids "imageTag=${VERSION}" \
                --query 'imageDetails[0].imageDigest' \
                --output text
            )"

            if [[ "${actual_digest}" != "${expected_digest}" ]]; then
              echo "::error::Promoted digest does not match."
              echo "::error::Expected: ${expected_digest}"
              echo "::error::Actual:   ${actual_digest}"
              exit 1
            fi
          }

          promote \
            "${BACKEND_ECR_REPOSITORY}" \
            "${SPRING_IMAGE}" \
            "${SPRING_DIGEST}"

          promote \
            "${FRONTEND_ECR_REPOSITORY}" \
            "${EXPRESS_IMAGE}" \
            "${EXPRESS_DIGEST}"

      # Candidate를 다시 빌드하지 않고 Release metadata만 추가한다.
      - name: Create release manifest
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          COMMIT_SHA: ${{ steps.vars.outputs.commit_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          CREATED_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          jq \
            --arg version "${VERSION}" \
            --arg releaseCommit "${COMMIT_SHA}" \
            --arg createdAt "${CREATED_AT}" \
            '{
              schemaVersion: 1,
              kind: "KtbBoardRelease",
              version: $version,
              releaseCommit: $releaseCommit,
              createdAt: $createdAt,
              components: .components
            }' \
            /tmp/candidate.json \
            > /tmp/release.json

          jq . /tmp/release.json

      - name: Store release manifest
        env:
          RELEASE_URI: ${{ steps.vars.outputs.release_uri }}
        shell: bash
        run: |
          set -Eeuo pipefail

          aws s3 cp \
            /tmp/release.json \
            "${RELEASE_URI}" \
            --content-type "application/json" \
            --only-show-errors

          echo "Release manifest stored: ${RELEASE_URI}"

            # ECR 이미지 승격이 완료된 뒤 Git의 Helm image tag를 변경한다.
            
      # Argo CD는 이 Git 변경을 감지하여 Kubernetes에 자동 배포한다.
      - name: Update GitOps image tags
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Release version: ${VERSION}"
          echo "Current ref: ${GITHUB_REF}"
          echo "Current commit: $(git rev-parse HEAD)"

          # Git이 사용자 입력을 기다리며 무한정 멈추는 것을 방지한다.
          export GIT_TERMINAL_PROMPT=0

          echo "Fetching latest main..."

          timeout 60s git fetch \
            --no-tags \
            origin \
            main \
            --depth=1

          echo "Fetched latest main successfully."

          git switch \
            --force-create gitops-release \
            origin/main

          echo "Switched to $(git rev-parse --abbrev-ref HEAD)"
          echo "GitOps base commit: $(git rev-parse HEAD)"

          export VERSION

          echo "Updating Helm values..."

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]

          value_files = [
              Path("ktb-board-spring/values.yaml"),
              Path("ktb-board-express/values.yaml"),
          ]

          pattern = re.compile(
              r"(?ms)"
              r"^(image:\s*\n)"
              r"(?P<body>(?:^[ \t]+.*\n|^[ \t]*#.*\n)*?)"
              r"(?P<prefix>^[ \t]+tag:\s*)"
              r"(?P<value>[^\n#]*)"
          )

          for path in value_files:
              print(f"Processing {path}...", flush=True)

              if not path.is_file():
                  raise SystemExit(f"values 파일이 없습니다: {path}")

              content = path.read_text(encoding="utf-8")

              match = pattern.search(content)
              if match is None:
                  raise SystemExit(
                      f"{path}에서 top-level image.tag를 찾지 못했습니다."
                  )

              current_tag = match.group("value").strip()
              print(
                  f"Updating {path}: {current_tag} -> {version}",
                  flush=True,
              )

              updated = (
                  content[:match.start("value")]
                  + version
                  + content[match.end("value"):]
              )

              path.write_text(updated, encoding="utf-8")

          print("All image tags updated.", flush=True)
          PY

          echo "Updated image values:"

          grep -A4 '^image:' ktb-board-spring/values.yaml
          grep -A4 '^image:' ktb-board-express/values.yaml

          echo "Changed files:"
          git status --short

      - name: Validate GitOps Helm charts
        shell: bash
        run: |
          set -Eeuo pipefail

          helm lint ./ktb-board-spring
          helm lint ./ktb-board-express

          helm template ktb-board-spring \
            ./ktb-board-spring \
            --namespace default \
            >/tmp/ktb-board-spring.yaml

          helm template ktb-board-express \
            ./ktb-board-express \
            --namespace default \
            >/tmp/ktb-board-express.yaml

      - name: Commit GitOps deployment
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          COMMIT_SHA: ${{ steps.vars.outputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          VALUES_FILES=(
            "ktb-board-spring/values.yaml"
            "ktb-board-express/values.yaml"
          )

          if git diff --quiet -- "${VALUES_FILES[@]}"; then
            echo "GitOps values에는 이미 ${VERSION}이 반영되어 있습니다."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${VALUES_FILES[@]}"

          git commit \
            -m "chore(deploy): promote production to ${VERSION} [skip ci]" \
            -m "Release commit: ${COMMIT_SHA}"

          # Checkout 단계에서 persist-credentials=false를 사용하므로
          # push 명령에 GITHUB_TOKEN을 명시한다.
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:main

          echo "GitOps deployment commit pushed for ${VERSION}."