name: Deploy ktb-board

# Main branch에 push되거나 수동으로 트리거할 때 워크플로우 실행
on:
  push:
    branches:
      - main
  workflow_dispatch:

# OIDC를 사용하여 AWS에 액세스할 수 있도록 권한을 부여
permissions:
  id-token: write
  contents: read

# 전역 환경변수
env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: 180294193538

  BACKEND_ECR_REPOSITORY: ktb-board-spring
  FRONTEND_ECR_REPOSITORY: ktb-board-express

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Github Repository 코드를 Runner로 가져오는 단계
      - name: Checkout
        uses: actions/checkout@v4

      # AWS 인증
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ECR 로그인
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 이미지 태그 생성 (Git commit SHA의 처음 12자리)
      - name: Set image variables
        id: vars
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          BACKEND_IMAGE="${REGISTRY}/${BACKEND_ECR_REPOSITORY}:${IMAGE_TAG}"
          FRONTEND_IMAGE="${REGISTRY}/${FRONTEND_ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${REGISTRY}/${BACKEND_ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${REGISTRY}/${FRONTEND_ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "IMAGE_TAG=${IMAGE_TAG}"
          echo "BACKEND_IMAGE=${BACKEND_IMAGE}"
          echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}"

      # Backend 이미지 빌드 및 ECR에 Push
      - name: Build and push backend ARM64 image
        run: |
          docker build \
            -t "${{ steps.vars.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:${{ steps.vars.outputs.image_tag }}" \
            ./backend
      
      - name: Push backend image
        run: |
          docker push "${{ steps.vars.outputs.registry }}/${{ env.BACKEND_ECR_REPOSITORY }}:${{ steps.vars.outputs.image_tag }}"

      # Frontend 이미지 빌드 및 ECR에 Push
      - name: Build and push frontend ARM64 image
        run: |
          docker build \
            -t "${{ steps.vars.outputs.registry }}/${{ env.FRONTEND_ECR_REPOSITORY }}:${{ steps.vars.outputs.image_tag }}" \
            ./frontend

      - name: Push frontend image
        run: |
          docker push "${{ steps.vars.outputs.registry }}/${{ env.FRONTEND_ECR_REPOSITORY }}:${{ steps.vars.outputs.image_tag }}"

      # SSM으로 App-A, App-B EC2 인스턴스에 deploy.sh 스크립트 실행 명령
      - name: Deploy to App EC2 instances via SSM
        run: |
          IMAGE_TAG="${{ steps.vars.outputs.image_tag }}"

          DEPLOY_COMMAND="sudo /opt/ktb-board/bin/deploy.sh all ${IMAGE_TAG} ${IMAGE_TAG}"

          echo "Deploy command: ${DEPLOY_COMMAND}"

          # EC2의 tag를 바탕으로 SSM SendCommand 대상 지정
          # 한 번에 한 인스턴스씩 배포, 하나라도 실패 시 전체 실패 처리
          COMMAND_ID="$(
            aws ssm send-command \
              --region "${AWS_REGION}" \
              --document-name "AWS-RunShellScript" \
              --targets \
                "Key=tag:Project,Values=ktb-board" \
                "Key=tag:Role,Values=app" \
                "Key=tag:Env,Values=prod" \
              --parameters "commands=[\"${DEPLOY_COMMAND}\"]" \
              --comment "Deploy ktb-board ${IMAGE_TAG}" \
              --max-concurrency "1" \
              --max-errors "0" \
              --query "Command.CommandId" \
              --output text
          )"

          echo "SSM Command ID: ${COMMAND_ID}"

          # AWS SSM 명령 실행 상태를 polling하여 배포 완료 여부 확인
          # 10초마다 상태 체크를 60회 반복 (총 10분)
          for i in {1..60}; do
            echo "Polling deployment status... attempt ${i}/60"

            STATUSES="$(
              aws ssm list-command-invocations \
                --region "${AWS_REGION}" \
                --command-id "${COMMAND_ID}" \
                --query "CommandInvocations[].Status" \
                --output text
            )"

            echo "Current statuses: ${STATUSES}"

            # 실패 상태 감지
            if echo "${STATUSES}" | grep -Eq "Failed|Cancelled|TimedOut|Cancelling"; then
              echo "Deployment failed."
              exit 1
            fi

            # 완료 상태 감지
            if [ -n "${STATUSES}" ] && ! echo "${STATUSES}" | grep -Eq "Pending|InProgress|Delayed"; then
              echo "Deployment completed."
              exit 0
            fi

            sleep 10
          done

          echo "Deployment polling timed out."
          exit 1