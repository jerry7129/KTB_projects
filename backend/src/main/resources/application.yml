spring:
  application:
    name: ktb-board-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  jpa:
    hibernate:
      ddl-auto: validate

server:
  forward-headers-strategy: framework
  servlet:
    context-path: /api