{{- if .Values.exposure.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-http-redirect
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/component: server
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  parentRefs:
    - name: {{ .Values.exposure.gateway.name | quote }}
      namespace: {{ .Values.exposure.gateway.namespace | quote }}
      sectionName: {{ .Values.exposure.gateway.httpSectionName | quote }}

  hostnames:
    - {{ .Values.exposure.hostname | quote }}

  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-route
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/component: server
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  parentRefs:
    - name: {{ .Values.exposure.gateway.name | quote }}
      namespace: {{ .Values.exposure.gateway.namespace | quote }}
      sectionName: {{ .Values.exposure.gateway.httpsSectionName | quote }}

  hostnames:
    - {{ .Values.exposure.hostname | quote }}

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: {{ .Values.exposure.service.name | quote }}
          port: {{ .Values.exposure.service.port }}
{{- end }}
