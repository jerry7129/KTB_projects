argo-cd:
  fullnameOverride: argocd

  crds:
    install: true
    keep: true

  global:
    domain: argocd.steven-project.store

    logging:
      format: text
      level: info

  configs:
    cm:
      url: https://argocd.steven-project.store

      # 초기에는 admin 계정을 사용
      admin.enabled: true

      # Git 변경 감지 주기
      timeout.reconciliation: 120s

    params:
      # HTTPS는 ALB에서 종료하고 ALB → Argo CD는 HTTP 사용
      server.insecure: true

  controller:
    replicas: 1

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 768Mi

  server:
    replicas: 1

    service:
      type: NodePort

      # nodePort를 지정하지 않음
      # Kubernetes가 30000~32767 범위에서 자동 할당

    # NGINX Ingress 대신 Gateway API를 사용할 예정
    ingress:
      enabled: false

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 500m
        memory: 768Mi

  repoServer:
    replicas: 1

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 500m
        memory: 768Mi

  redis:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # 현재는 일반 Application만 사용
  applicationSet:
    enabled: false

  # GitHub SSO 등을 사용할 때 활성화
  dex:
    enabled: false

  # Slack, 이메일 알림을 붙일 때 활성화
  notifications:
    enabled: false
